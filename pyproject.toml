[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "charactercheck"
version = "0.7.0"
description = "Experimental read-only derivation of selected D&D Beyond character fields with provenance and findings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
authors = [{name = "chaoz23"}]
keywords = ["dnd", "dndbeyond", "character-sheet", "ttrpg", "agents", "mcp", "deterministic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[project.urls]
Homepage = "https://github.com/chaoz23/charactercheck"

[project.scripts]
charactercheck = "charactercheck.cli:main"
charactercheck-mcp = "charactercheck.mcp:main"

[tool.setuptools]
packages = ["charactercheck"]

[tool.setuptools.package-data]
charactercheck = ["sample-character.json", "ddb-config-registry.json"]
