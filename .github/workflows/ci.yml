name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only — no deps to install)
        run: python -m unittest discover -s tests -v
      - name: QA scorecard on fixtures
        run: |
          python -m charactercheck.cli qa tests/fixtures/torvald.json
          python -m charactercheck.cli qa tests/fixtures/vexa.json
